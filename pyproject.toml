[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sitewatch-data-client"
version = "0.1.0"
description = "Read-only, Pydantic-typed Python client for the DRB SiteWatch POS database (ICON Car Wash)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fdb>=2.0,<3",
    "pydantic>=2.10,<3",
    "pandas>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "python-dotenv>=1.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sitewatch_data_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live tests against the SiteWatch database (skipped unless SITEWATCH_LIVE=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Python blocks in the Markdown docs are hand-formatted examples (aligned comments, output
# lines); keep `ruff format --check .` from rewriting them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
